services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fixops
      POSTGRES_PASSWORD: fixops
      POSTGRES_DB: fixops_iq
    ports: ["5432:5432"]
    volumes: ["fixops-postgres:/var/lib/postgresql/data"]
  api:
    build: .
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql+asyncpg://fixops:fixops@postgres:5432/fixops_iq
      AI_PROVIDER: mock
    ports: ["8000:8000"]
volumes:
  fixops-postgres:
