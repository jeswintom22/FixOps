[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fixops"
version = "0.5.0"
description = "CLI-first AI SRE agent for incident investigation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FixOps Contributors" },
]
keywords = ["sre", "incident", "operations", "llm", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.12",
    "rich>=13.0",
    "openai>=1.0",
    "httpx>=0.25",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "python-multipart>=0.0.6",
]
ui = [
    "streamlit>=1.28",
    "requests>=2.31",
]
ollama = [
    "ollama>=0.1.0",
]
local = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.6",
    "httpx>=0.25",
]

[project.scripts]
fixops = "fixops.cli:main"

[project.urls]
Homepage = "https://github.com/jeswin/fixops"
Repository = "https://github.com/jeswin/fixops"

[tool.setuptools.packages.find]
where = ["."]
include = ["fixops*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["fixops"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ollama.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
